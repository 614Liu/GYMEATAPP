<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>健食 · 一碗饭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
/*
  「一碗饭」第三轮：一饭三菜一杯水。
  数据：目标 2000 kcal / 蛋白 150 / 碳水 200 / 脂肪 65；饮水目标 2000 ml
  早餐 460 · 午餐 620 · 加餐 95 · 晚餐 0  → 已吃 1175，还能吃 825
  蛋白 74.5 · 碳水 144 · 脂肪 32.3；饮水 1250
*/
:root { --cjk: -apple-system, "PingFang SC", "Microsoft YaHei UI", "Noto Sans SC", system-ui, sans-serif; --num: "Outfit", var(--cjk); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #cfd3d1; font-family: var(--cjk); padding: 32px 16px 64px; color: #111; }
.page-h { max-width: 860px; margin: 0 auto 6px; font-size: 22px; font-weight: 700; }
.page-p { max-width: 860px; margin: 0 auto 28px; font-size: 14px; line-height: 1.6; color: #3d4240; }
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; }
.cap { font-size: 15px; font-weight: 700; margin-bottom: 12px; text-align: center; }
.phone { width: 390px; height: 844px; border-radius: 46px; overflow: hidden; position: relative; box-shadow: 0 40px 80px rgba(0,0,0,.22); }

/* ---------- 主题 ---------- */
.day   { --bg: #f7f6f3; --ink: #141615; --sub: #6a6f6c; --card: #ffffff; --line: rgba(20,22,21,.07); --glass: rgba(255,255,255,.28); --glass-edge: rgba(20,22,21,.14); --hi: rgba(255,255,255,.9); --shadow: rgba(40,40,30,.10); --chip: #efeee9; --accent: #1f9d6b; --accentInk: #fff; --tab: rgba(247,246,243,.86); }
.night { --bg: #0f1110; --ink: #f2f4f3; --sub: #9aa19e; --card: #1a1d1c; --line: rgba(255,255,255,.07); --glass: rgba(255,255,255,.05); --glass-edge: rgba(255,255,255,.22); --hi: rgba(255,255,255,.35); --shadow: rgba(0,0,0,.5); --chip: #222624; --accent: #3ccf8e; --accentInk: #04140c; --tab: rgba(15,17,16,.86); }

.screen { position: absolute; inset: 0; background: var(--bg); color: var(--ink); overflow: hidden; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
.press { cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; transition: transform 160ms cubic-bezier(.3,1.5,.5,1); }
.press:active { transform: scale(.94); transition-duration: 70ms; }

.status { height: 46px; display: flex; justify-content: space-between; align-items: center; padding: 0 30px; font: 600 15px var(--num); }
.head { display: flex; justify-content: space-between; align-items: center; padding: 4px 20px 0; }
.head h1 { font-size: 17px; font-weight: 700; }
.date { display: flex; align-items: center; gap: 2px; background: var(--chip); border-radius: 999px; padding: 4px; }
.date span { font-size: 13px; font-weight: 600; padding: 0 8px; }
.date b { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; color: var(--sub); }

.hero { padding: 14px 20px 0; display: flex; justify-content: space-between; align-items: flex-end; }
.hero .l { font-size: 14px; font-weight: 600; color: var(--sub); }
.hero .k { font-size: 64px; font-weight: 600; letter-spacing: -.03em; line-height: 1; margin-top: 4px; display: inline-block; }
.hero .k small { font-size: 18px; font-weight: 500; letter-spacing: 0; color: var(--sub); margin-left: 4px; }
.hero .r { text-align: right; font-size: 13px; color: var(--sub); font-weight: 600; line-height: 1.5; }
.hero .r b { color: var(--ink); font-family: var(--num); font-size: 17px; font-weight: 600; }

.bowl { display: block; margin: 2px auto 0; }
.dishes { display: grid; grid-template-columns: repeat(4, 1fr); padding: 0 10px; margin-top: -4px; }
.dish { text-align: center; }
.dish svg { display: block; margin: 0 auto; }
.dish .t { font-size: 13px; font-weight: 600; color: var(--sub); margin-top: -2px; }
.dish .v { font-size: 16px; font-weight: 600; white-space: nowrap; }
.dish .v small { font-size: 11px; }
.dish .v small { font-size: 12px; color: var(--sub); font-weight: 500; }

.meals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 16px 0; }
.meals::-webkit-scrollbar { display: none; }
.meal { background: var(--card); border-radius: 22px; padding: 12px 14px; box-shadow: 0 1px 0 var(--line); }
.meal .t { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; }
.meal .t i { width: 8px; height: 8px; border-radius: 50%; }
.meal .k { font-size: 24px; font-weight: 600; margin-top: 4px; }
.meal .k small { font-size: 12px; color: var(--sub); font-weight: 500; }
.meal .f { font-size: 12px; color: var(--sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meal.add { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); display: flex; flex-direction: column; justify-content: space-between; }
.meal.add .plus { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--accentInk); display: grid; place-items: center; font-size: 22px; font-weight: 600; }

.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 86px; background: var(--tab); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); display: grid; grid-template-columns: repeat(5, 1fr); padding: 8px 6px 0; box-shadow: 0 -1px 0 var(--line); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--sub); padding-top: 4px; }
.tab.on { color: var(--ink); }
.tab svg { width: 24px; height: 24px; }
.tab-add { justify-self: center; width: 58px; height: 58px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; margin-top: -16px; box-shadow: 0 10px 24px var(--shadow); }

@media (prefers-reduced-motion: reduce) { .press, .press:active { transition: none; transform: none; } }
</style>
</head>
<body>
<h1 class="page-h">「一碗饭」· 第三轮</h1>
<p class="page-p">一饭三菜一杯水：大玻璃碗装今天的热量，一层一层是早餐、午餐、加餐、晚餐，碗口是目标；三只小碟是蛋白质、碳水、脂肪，各装各的进度；杯子是饮水。同一个设计做了白天和夜间两版。可以点：晚餐卡片的 +（加 180 kcal）、杯子（加 250 ml）、任意小碟（加 10g），看它们带弹簧地涨上去；连点晚餐几次，碗满了会溢出来变红。</p>

<div class="row">
  <div><div class="cap">白天</div><div class="phone" id="p-day"></div></div>
  <div><div class="cap">夜间</div><div class="phone" id="p-night"></div></div>
</div>

<template id="tpl">
  <div class="screen">
    <div class="status"><span>9:41</span><span>5G 100%</span></div>
    <div class="head"><h1>今天</h1><div class="date"><b class="press">‹</b><span>11月5日 周三</span><b class="press" style="opacity:.35">›</b></div></div>
    <div class="hero">
      <div><div class="l">还能吃</div><div class="k num" data-left>825<small>kcal</small></div></div>
      <div class="r">已吃 <b data-eaten>1175</b><br>目标 <b>2000</b></div>
    </div>
    <svg class="bowl press" data-bowl width="350" height="236" viewBox="0 0 350 236" aria-label="今天的热量"></svg>
    <div class="dishes">
      <div class="dish press" data-dish="protein"><svg width="88" height="62" viewBox="0 0 108 74"></svg><div class="t">蛋白质</div><div class="v num"><span data-v>74.5</span><small>/150 g</small></div></div>
      <div class="dish press" data-dish="carbs"><svg width="88" height="62" viewBox="0 0 108 74"></svg><div class="t">碳水</div><div class="v num"><span data-v>144</span><small>/200 g</small></div></div>
      <div class="dish press" data-dish="fat"><svg width="88" height="62" viewBox="0 0 108 74"></svg><div class="t">脂肪</div><div class="v num"><span data-v>32.3</span><small>/65 g</small></div></div>
      <div class="dish press" data-water><svg width="88" height="62" viewBox="0 0 92 62" data-glass></svg><div class="t">饮水</div><div class="v num"><span data-wv>1250</span><small>/2000 ml</small></div></div>
    </div>
    <div class="meals">
      <div class="meal press"><div class="t"><i data-c="0"></i>早餐</div><div class="k num">460<small> kcal</small></div><div class="f">燕麦牛奶 · 水煮蛋×2</div></div>
      <div class="meal press"><div class="t"><i data-c="1"></i>午餐</div><div class="k num">620<small> kcal</small></div><div class="f">鸡胸肉饭</div></div>
      <div class="meal press"><div class="t"><i data-c="2"></i>加餐</div><div class="k num">95<small> kcal</small></div><div class="f">苹果</div></div>
      <div class="meal add press" data-add-dinner><div class="t"><i data-c="3"></i>晚餐</div><div style="display:flex;justify-content:space-between;align-items:end"><span class="k num" data-dinner style="margin:0">—</span><span class="plus">+</span></div></div>
    </div>
    <nav class="tabbar">
      <div class="tab on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M3 10.5h18a9 9 0 0 1-18 0Z"/><path d="M8.5 7.5c0-1.6 1.5-1.6 1.5-3.2M13.5 7.5c0-1.6 1.5-1.6 1.5-3.2"/></svg>今天</div>
      <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 19V11M10 19V5M16 19v-6M22 19H2"/></svg>趋势</div>
      <div class="tab-add press"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
      <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 4h14v16H5zM5 9h14M9 13h6"/></svg>食物库</div>
      <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6" stroke-linecap="round"/></svg>我的</div>
    </nav>
  </div>
</template>

<script>
const NS = 'http://www.w3.org/2000/svg';
const THEMES = {
  day:   { meals: ['#b4e6cb', '#6fcf9e', '#2fae75', '#13784e'], over: '#e5484d', protein: '#8f6be8', carbs: '#e8a93a', fat: '#ec7a4f', water: '#62b6ec' },
  night: { meals: ['#17402e', '#22704d', '#2fa16c', '#5fd69c'], over: '#ff6369', protein: '#a98bff', carbs: '#f2bb55', fat: '#ff8f63', water: '#6cc0f5' },
};
const GOAL = 2000;

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const lighten = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  const mix = (c) => Math.round(c + (255 - c) * a);
  return `rgb(${mix(n >> 16)},${mix((n >> 8) & 255)},${mix(n & 255)})`;
};

/*
  一只 3/4 视角的玻璃碗：碗身是半个椭圆，碗口是一个扁椭圆。
  layers 从下往上堆，每层高度按数值占目标的比例；食物表面画成一个椭圆，看起来有深度。
*/
function drawBowl(svg, o) {
  svg.innerHTML = '';
  const { cx, rimY, rx, depth, rimRy, layers, max, labels, uid } = o;
  const bottom = rimY + depth;
  const halfAt = (y) => rx * Math.sqrt(Math.max(0, 1 - ((y - rimY) / depth) ** 2));
  const defs = el('defs', {}, svg);
  const clip = el('clipPath', { id: 'c' + uid }, defs);
  el('path', { d: `M${cx - rx},${rimY} A${rx},${depth} 0 0 0 ${cx + rx},${rimY} Z` }, clip);
  const blur = el('filter', { id: 'b' + uid, x: '-50%', y: '-50%', width: '200%', height: '200%' }, defs);
  el('feGaussianBlur', { stdDeviation: rx * 0.07 }, blur);

  // 桌面上的投影
  el('ellipse', { cx, cy: bottom + 4, rx: rx * 0.62, ry: rx * 0.07, fill: 'var(--shadow)', filter: `url(#b${uid})` }, svg);
  // 碗内壁（碗口后半圈）
  el('ellipse', { cx, cy: rimY, rx, ry: rimRy, fill: 'var(--glass)', stroke: 'var(--glass-edge)', 'stroke-width': 1.2 }, svg);

  // 食物层
  const g = el('g', { 'clip-path': `url(#c${uid})` }, svg);
  let acc = 0, topColor = null, topY = bottom;
  const total = layers.reduce((s, l) => s + l.v, 0);
  const capped = Math.min(total, max);
  layers.forEach((l, i) => {
    if (l.v <= 0) return;
    const from = Math.min(acc, max), to = Math.min(acc + l.v, max);
    acc += l.v;
    if (to <= from) return;
    const y1 = bottom - (to / max) * depth, y0 = bottom - (from / max) * depth;
    el('rect', { x: cx - rx, y: y1, width: rx * 2, height: y0 - y1 + 0.5, fill: l.c }, g);
    // 层与层之间一道很淡的分界
    if (from > 0) el('ellipse', { cx, cy: y0, rx: halfAt(y0), ry: halfAt(y0) * rimRy / rx, fill: 'none', stroke: 'rgba(255,255,255,.35)', 'stroke-width': 1 }, g);
    topColor = l.c; topY = y1;
    if (labels && l.label) labels.push({ y: (y0 + y1) / 2, text: l.label, c: l.c, h: y0 - y1 });
  });
  // 食物表面（椭圆，显得有深度）
  if (topColor && capped > 0) {
    const hw = halfAt(topY);
    el('ellipse', { cx, cy: topY, rx: hw, ry: Math.max(1, hw * rimRy / rx), fill: lighten(topColor.startsWith('#') ? topColor : '#888888', .28) }, svg);
  }
  // 溢出：碗口上冒出来一圈红色
  if (total > max) {
    const over = Math.min((total - max) / max, 0.25);
    el('ellipse', { cx, cy: rimY - over * depth * 0.5, rx: rx * 0.98, ry: rimRy + over * depth * 0.5, fill: o.overColor, opacity: .9 }, svg);
  }
  // 玻璃：外沿 + 高光
  el('path', { d: `M${cx - rx},${rimY} A${rx},${depth} 0 0 0 ${cx + rx},${rimY}`, fill: 'var(--glass)', stroke: 'var(--glass-edge)', 'stroke-width': 1.4 }, svg);
  el('path', { d: `M${cx - rx * 0.86},${rimY + depth * 0.18} A${rx * 0.88},${depth * 0.9} 0 0 0 ${cx - rx * 0.3},${rimY + depth * 0.86}`, fill: 'none', stroke: 'var(--hi)', 'stroke-width': rx * 0.045, 'stroke-linecap': 'round', opacity: .8 }, svg);
  el('ellipse', { cx, cy: rimY, rx, ry: rimRy, fill: 'none', stroke: 'var(--glass-edge)', 'stroke-width': 1.6 }, svg);
  el('ellipse', { cx: cx - rx * 0.35, cy: rimY - rimRy * 0.45, rx: rx * 0.22, ry: 1.4, fill: 'var(--hi)' }, svg);
}

/* 弹簧：每个数值都有自己的速度，目标一变就从当前位置追过去（可打断） */
function spring(initial, onUpdate, { stiffness = 170, damping = 16 } = {}) {
  let x = initial, v = 0, target = initial, raf = 0, last = 0;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function step(t) {
    const dt = Math.min(0.032, (t - last) / 1000 || 0.016); last = t;
    const a = -stiffness * (x - target) - damping * v;
    v += a * dt; x += v * dt;
    if (Math.abs(v) < 0.05 && Math.abs(x - target) < 0.05) { x = target; v = 0; onUpdate(x); raf = 0; return; }
    onUpdate(x); raf = requestAnimationFrame(step);
  }
  onUpdate(x);
  return (to) => { target = to; if (reduced) { x = to; onUpdate(x); return; } if (!raf) { last = performance.now(); raf = requestAnimationFrame(step); } };
}

function mount(rootId, themeName) {
  const T = THEMES[themeName];
  const phone = document.getElementById(rootId);
  phone.appendChild(document.getElementById('tpl').content.cloneNode(true));
  phone.firstElementChild.classList.add(themeName);
  const $ = (s) => phone.querySelector(s);
  phone.querySelectorAll('[data-c]').forEach((i) => (i.style.background = T.meals[+i.dataset.c]));

  const state = { meals: [460, 620, 95, 0], shown: [460, 620, 95, 0], protein: 74.5, carbs: 144, fat: 32.3, water: 1250 };
  const goals = { protein: 150, carbs: 200, fat: 65 };
  const bowlSvg = $('[data-bowl]');

  function renderBowl() {
    const labels = [];
    drawBowl(bowlSvg, {
      uid: rootId + 'big', cx: 150, rimY: 34, rx: 128, depth: 170, rimRy: 22, max: GOAL, overColor: T.over,
      layers: state.shown.map((v, i) => ({ v, c: T.meals[i], label: ['早餐', '午餐', '加餐', '晚餐'][i] + ' ' + Math.round(state.meals[i]) })), labels,
    });
    // 右侧标注：每层一条引线
    let lastY = -99;
    const rimY = 34, rx = 128, depth = 170, cx = 150;
    labels.filter((l) => l.h >= 9).sort((a, b) => a.y - b.y).forEach((l) => { // 太薄的层不标
      const y = Math.max(l.y, lastY + 18); lastY = y;
      const edge = cx + rx * Math.sqrt(Math.max(0, 1 - ((l.y - rimY) / depth) ** 2));
      el('circle', { cx: edge - 6, cy: l.y, r: 2.5, fill: 'var(--ink)', opacity: .5 }, bowlSvg);
      el('line', { x1: edge - 6, y1: l.y, x2: 286, y2: y, stroke: 'var(--glass-edge)', 'stroke-width': 1 }, bowlSvg);
      const t = el('text', { x: 290, y: y + 4, 'font-size': 12, 'font-weight': 600, fill: 'var(--sub)', 'font-family': 'var(--cjk)' }, bowlSvg);
      t.textContent = l.text;
    });
  }
  const mealSprings = state.meals.map((v, i) => spring(v, (x) => { state.shown[i] = x; renderBowl(); }, { stiffness: 150, damping: 14 }));

  const leftEl = $('[data-left]');
  const leftSpring = spring(1175, (x) => {
    const left = GOAL - x;
    leftEl.firstChild.nodeValue = left >= 0 ? Math.round(left) : '+' + Math.round(-left);
    leftEl.style.color = left < 0 ? T.over : '';
    leftEl.previousElementSibling.textContent = left < 0 ? '超出了' : '还能吃';
  }, { stiffness: 120, damping: 20 });

  function updateTotals() {
    const eaten = state.meals.reduce((s, v) => s + v, 0);
    leftSpring(eaten);
    $('[data-eaten]').textContent = eaten;
    $('[data-dinner]').textContent = state.meals[3] || '—';
  }

  // 三只小碟
  const dishSprings = {};
  phone.querySelectorAll('[data-dish]').forEach((d) => {
    const key = d.dataset.dish, svg = d.querySelector('svg');
    dishSprings[key] = spring(state[key], (x) => drawBowl(svg, { uid: rootId + key, cx: 54, rimY: 14, rx: 44, depth: 50, rimRy: 9, max: goals[key], overColor: T.over, layers: [{ v: x, c: T[key] }] }), { stiffness: 180, damping: 14 });
    d.addEventListener('click', () => { state[key] = Math.round((state[key] + 10) * 10) / 10; d.querySelector('[data-v]').textContent = state[key]; dishSprings[key](state[key]); });
  });

  // 水杯：圆柱
  const glass = $('[data-glass]');
  const drawGlass = (ml) => {
    glass.innerHTML = '';
    const frac = Math.min(ml / 2000, 1), top = 8, bot = 54, h = (bot - top) * frac;
    const defs = el('defs', {}, glass); const cp = el('clipPath', { id: 'g' + rootId }, defs);
    el('path', { d: 'M30,8 L34,54 Q46,58 58,54 L62,8 Z' }, cp);
    const g = el('g', { 'clip-path': `url(#g${rootId})` }, glass);
    el('rect', { x: 28, y: bot - h, width: 36, height: h + 2, fill: T.water }, g);
    el('ellipse', { cx: 46, cy: bot - h, rx: 15.5 - (1 - frac) * 1.6, ry: 2.6, fill: lighten(T.water, .35) }, g);
    el('path', { d: 'M30,8 L34,54 Q46,58 58,54 L62,8', fill: 'var(--glass)', stroke: 'var(--glass-edge)', 'stroke-width': 1.3 }, glass);
    el('ellipse', { cx: 46, cy: 8, rx: 16, ry: 3, fill: 'none', stroke: 'var(--glass-edge)', 'stroke-width': 1.3 }, glass);
    el('line', { x1: 35, y1: 14, x2: 37.5, y2: 46, stroke: 'var(--hi)', 'stroke-width': 2.2, 'stroke-linecap': 'round' }, glass);
  };
  const waterSpring = spring(state.water, drawGlass, { stiffness: 140, damping: 11 });
  $('[data-water]').addEventListener('click', () => { state.water += 250; $('[data-wv]').textContent = state.water; waterSpring(state.water); });

  $('[data-add-dinner]').addEventListener('click', () => {
    state.meals[3] += 180; mealSprings[3](state.meals[3]); updateTotals();
  });
  // 点大碗：轻轻一晃
  bowlSvg.addEventListener('click', () => {
    const before = state.meals[3]; mealSprings[3](before + 40); setTimeout(() => mealSprings[3](before), 90);
  });

  renderBowl(); updateTotals();
}

mount('p-day', 'day');
mount('p-night', 'night');
</script>
</body>
</html>
