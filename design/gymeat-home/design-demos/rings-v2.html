<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>健食 · 首页 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+SC:wght@500;600;700;900&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
/*
  首页 v2
  - 圆环沿用现在 App 的样子：一个粗环按蛋白质 / 碳水 / 脂肪分色，中间一个圆盘写剩余热量。
    加强一点：整圈 = 每日目标 2000 kcal，吃了的部分按三大营养素分色，没吃的留灰，中间「还能吃 825」。
  - 疏一点：教练和那句话合成一条；任务变成 2×2 小方块，点方块推进；每顿只留照片、名字、热量。
  - 保留原来的：火苗 Logo +「健食 by 614」、翡翠绿、「差 75g」、早午晚加餐图标、饮水蓝 / 体重紫。
  - 玻璃只在底部导航和「记一笔」弹层。
*/
:root {
  --bg: #f2f4f3; --card: #fff; --ink: #101413; --sub: #59625f; --faint: #6d7673; --line: #edf0ee;
  --emerald: #10b981; --emerald-deep: #0b7a55; --emerald-soft: #e6f6ef;
  --protein: #a855f7; --carbs: #3b82f6; --fat: #f97316; --water: #3b82f6; --weight: #8b5cf6;
  --num: "Barlow Condensed", "Noto Sans SC", sans-serif;
}
body { background: #dfe3e1; color: var(--ink); font-family: "Noto Sans SC", sans-serif; min-height: 100vh; }
.board { max-width: 1260px; margin: 0 auto; padding: 44px 32px 80px; display: grid; grid-template-columns: 320px auto auto; gap: 44px; align-items: start; }
.board-h { padding-top: 24px; }
.board-h h1 { font-size: 40px; font-weight: 900; }
.board-h h1 small { display: block; font-size: 17px; font-weight: 700; color: var(--sub); margin-top: 6px; }
.board-h p { margin-top: 16px; font-size: 14.5px; line-height: 1.75; color: #3d4441; }
.board-h h2 { font-size: 14px; font-weight: 900; margin-top: 20px; }
.board-h ul { list-style: none; font-size: 13.5px; line-height: 1.95; color: #3d4441; margin-top: 4px; }
.board-h ul b { color: var(--emerald-deep); }
.second { margin-top: 110px; transform: scale(.86); transform-origin: top center; }

.app { position: absolute; inset: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans SC", sans-serif; }
.scroll { position: absolute; inset: 0; overflow-y: auto; padding: 40px 16px 120px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.num { font-family: var(--num); }
section + section, .chips { margin-top: 16px; }

/* 品牌头 */
.top { display: flex; justify-content: space-between; align-items: center; padding: 2px 0 12px; }
.brand { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 999px; padding: 6px 14px 6px 6px; }
.brand .logo { width: 34px; height: 34px; border-radius: 50%; background: #1e2a28; color: #fff; display: grid; place-items: center; }
.brand .logo svg { width: 18px; height: 18px; }
.brand b { font-size: 17px; font-weight: 900; line-height: 1; display: block; } .brand small { font-size: 10px; font-weight: 700; color: var(--emerald); letter-spacing: .08em; }
.streak { display: flex; align-items: center; gap: 6px; background: #fff; border-radius: 999px; padding: 6px 12px 6px 6px; font-size: 13px; font-weight: 900; }
.streak i { width: 26px; height: 26px; border-radius: 50%; background: #ff7a1a; color: #fff; display: grid; place-items: center; font: 800 15px var(--num); font-style: normal; }

/* 一周 */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: #fff; border-radius: 22px; padding: 6px; }
.day { text-align: center; padding: 6px 0 5px; border-radius: 16px; font-size: 11px; color: var(--sub); font-weight: 700; }
.day b { display: block; font: 700 19px var(--num); color: var(--ink); }
.day i { display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--emerald); margin: 2px auto 0; }
.day.on { background: var(--ink); color: #c9d2ce; } .day.on b { color: #fff; }
.day.future { opacity: .45; } .day.future i { background: transparent; }

/* 主卡：现在 App 的圆环 */
.hero { background: var(--card); border-radius: 32px; padding: 20px 18px 18px; margin-top: 16px; }
.donut { position: relative; width: 228px; height: 228px; margin: 0 auto; }
.donut svg { width: 100%; height: 100%; display: block; overflow: visible; }
.disc { position: absolute; inset: 44px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: conic-gradient(from 90deg, #f8fafc, #e2e8f0, #f8fafc, #e2e8f0, #f8fafc);
  box-shadow: inset 0 0 20px rgba(255,255,255,.85), 0 10px 20px rgba(0,0,0,.08), 0 2px 5px rgba(0,0,0,.05); }
.disc .lab { font-size: 13px; font-weight: 800; color: var(--sub); }
.disc .big { font: 700 54px var(--num); line-height: .95; }
.disc .u { font-size: 12px; font-weight: 800; color: var(--sub); letter-spacing: .06em; }
.eaten { text-align: center; font-size: 13px; font-weight: 700; color: var(--sub); margin-top: 10px; }
.eaten b { font: 700 17px var(--num); color: var(--ink); }
.macros { display: grid; gap: 10px; margin-top: 16px; }
.ms { display: grid; grid-template-columns: 82px 1fr 92px; gap: 10px; align-items: center; }
.ms .n { display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 800; }
.ms .n i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; } .ms .n i svg { width: 12px; height: 12px; }
.ms .bar { height: 8px; border-radius: 999px; background: #eef1f0; overflow: hidden; } .ms .bar i { display: block; height: 100%; border-radius: 999px; }
.ms .v { text-align: right; line-height: 1.1; }
.ms .v b { font: 700 17px var(--num); } .ms .v em { font-style: normal; font: 600 13px var(--num); color: var(--faint); }
.ms .v small { display: block; font-size: 11px; font-weight: 800; color: var(--faint); }
.ms .v small.over { color: #e11d48; }

/* 教练条（教练卡 + 那句话合一） */
.coach { display: flex; align-items: center; gap: 12px; background: var(--emerald-soft); border-radius: 22px; padding: 12px 14px; margin-top: 16px; }
.coach .ic { width: 34px; height: 34px; flex: none; border-radius: 11px; background: #fff; color: var(--emerald); display: grid; place-items: center; } .coach .ic svg { width: 18px; height: 18px; }
.coach p { flex: 1; font-size: 13.5px; font-weight: 700; color: #0f5a40; line-height: 1.5; }
.coach .arrow { font: 700 20px var(--num); color: var(--emerald-deep); }

/* 饮水 / 体重 */
.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.chip { background: var(--card); border-radius: 24px; padding: 14px; display: flex; align-items: center; justify-content: space-between; }
.chip .t { font-size: 12px; font-weight: 800; } .chip .v { font: 700 26px var(--num); white-space: nowrap; } .chip .v small { font-size: 14px; color: var(--faint); }
.chip .btn { border-radius: 14px; padding: 0 10px; height: 44px; color: #fff; font-size: 13px; font-weight: 900; display: grid; place-items: center; }

/* 任务 2×2 */
.card { background: var(--card); border-radius: 28px; padding: 16px; }
.card h3 { font-size: 16px; font-weight: 900; display: flex; justify-content: space-between; align-items: center; padding: 0 2px 12px; }
.card h3 span { font-size: 12px; font-weight: 800; color: var(--sub); }
.tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { border-radius: 20px; padding: 12px 12px 12px 14px; background: #f5f7f6; position: relative; transition: background .25s; }
.tile .n { font-size: 13px; font-weight: 800; color: var(--sub); }
.tile .v { font: 700 24px var(--num); margin-top: 2px; } .tile .v em { font-style: normal; font-size: 14px; color: var(--faint); }
.tile .tr { height: 5px; border-radius: 999px; background: rgba(16,20,19,.08); margin-top: 6px; overflow: hidden; } .tile .tr i { display: block; height: 100%; border-radius: 999px; }
.tile .mark { position: absolute; right: 10px; top: 10px; width: 26px; height: 26px; border-radius: 50%; background: #fff; display: grid; place-items: center; font: 700 18px var(--num); color: var(--emerald-deep); }
.tile .mark svg { width: 14px; height: 14px; }
.tile.done { background: var(--emerald-soft); } .tile.done .mark { background: var(--emerald); }

/* 今天吃的 */
.meal-h { display: flex; align-items: center; gap: 8px; padding: 6px 2px; font-size: 13px; font-weight: 900; color: var(--sub); }
.meal-h svg { width: 17px; height: 17px; }
.meal-h .sum { margin-left: auto; font: 700 15px var(--num); color: var(--ink); }
.meal-h .add { width: 32px; height: 32px; border-radius: 50%; background: var(--emerald-soft); color: var(--emerald-deep); display: grid; place-items: center; font: 700 20px var(--num); margin-left: 8px; }
.food { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; padding: 6px 2px 12px; }
.food .pic { width: 48px; height: 48px; border-radius: 15px; overflow: hidden; }
.food .n { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.food .k { font: 700 21px var(--num); }
.tag { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 7px; background: #e6f6ef; color: #0b7a55; }
.meal-g + .meal-g { box-shadow: inset 0 1px 0 var(--line); padding-top: 6px; }
.empty-meal { margin: 0 2px 8px; border: 2px dashed #d6ddda; border-radius: 16px; padding: 11px 12px; font-size: 13px; font-weight: 700; color: var(--sub); }

/* 玻璃：导航 + 弹层 */
.nav { position: absolute; left: 0; right: 0; bottom: 0; height: 88px; display: grid; grid-template-columns: repeat(5, 1fr); padding-top: 10px; z-index: 20; background: rgba(255,255,255,.72); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); box-shadow: 0 -1px 0 rgba(0,0,0,.06); }
.nav span { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 800; color: #7a8481; }
.nav span.on { color: var(--ink); } .nav svg { width: 24px; height: 24px; }
.nav .plus { justify-self: center; width: 60px; height: 60px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; margin-top: -22px; box-shadow: 0 10px 24px rgba(16,20,19,.28); }
.sheet { padding: 0 16px 34px; border-radius: 32px 32px 0 0; background: rgba(250,251,250,.86); -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 -10px 40px rgba(0,0,0,.14); }
.grip { background: #c9d0cd; }
.sheet h4 { font-size: 21px; font-weight: 900; margin: 6px 4px 12px; }
.mt { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
.mt div { text-align: center; padding: 9px 0; border-radius: 14px; background: #fff; font-size: 12px; font-weight: 800; color: var(--sub); }
.mt div svg { width: 16px; height: 16px; display: block; margin: 0 auto 2px; }
.mt div.on { background: var(--emerald-soft); color: var(--emerald-deep); box-shadow: inset 0 0 0 2px var(--emerald); }
.ways { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.way { border-radius: 20px; padding: 12px; background: #fff; font-size: 14px; font-weight: 900; min-height: 80px; display: flex; flex-direction: column; justify-content: space-between; }
.way svg { width: 22px; height: 22px; } .way small { display: block; font-size: 11px; font-weight: 700; color: var(--sub); }
.way.main { background: var(--ink); color: #fff; } .way.main small { color: #b9c2bf; }
.qh { font-size: 12px; font-weight: 800; color: var(--sub); margin: 0 4px 4px; }
.quick { display: grid; grid-template-columns: 50px 1fr auto 44px; gap: 12px; align-items: center; padding: 6px 4px; }
.quick .pic { width: 50px; height: 50px; border-radius: 15px; overflow: hidden; }
.quick .n { font-size: 15px; font-weight: 800; } .quick .n small { display: block; font-size: 12px; color: var(--sub); font-weight: 600; }
.quick .k { font: 700 19px var(--num); }
.quick .go { width: 44px; height: 44px; border-radius: 50%; background: var(--emerald); color: #fff; display: grid; place-items: center; font: 700 24px var(--num); }
.toast { position: absolute; left: 50%; top: 52px; transform: translate(-50%, -110px); z-index: 50; padding: 10px 16px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 14px; font-weight: 800; white-space: nowrap; transition: transform .5s cubic-bezier(.3,1.5,.5,1); }
.toast.show { transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="board">
  <div class="board-h">
    <h1>健食<small>首页 v2 · 圆环回到现在的样子</small></h1>
    <p>圆环和现在 App 里一样：一个粗环分三色，中间一个圆盘。整圈代表今天的目标 2000 kcal，吃了的部分按蛋白质、碳水、脂肪分色，没吃的留灰——一眼就知道吃了多少、吃的是什么、还剩多少。其余内容收疏了。</p>
    <h2>可以点</h2>
    <ul>
      <li><b>点任务方块</b>　推进一步，完成变绿打勾</li>
      <li><b>点「+250ml」</b>　饮水和喝水任务一起涨</li>
      <li><b>点底部 + 或某顿饭的 +</b>　玻璃弹层升起，可拖走</li>
      <li><b>点一样常吃的</b>　记进去，圆环、数字一起动</li>
    </ul>
  </div>
  <div id="main"></div>
  <div id="second" class="second"></div>
</div>

<template id="app">
  <div class="app">
    <div class="scroll">
      <div class="top">
        <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3.5 5 5.6 5 10.5A5 5 0 0 1 12 18a5 5 0 0 1-5-5.5c0-2.2 1.2-3.6 2.4-4.6.2 1.6 1 2.6 2 3C11 8 11.6 5 12 2Z"/></svg></span><span><b>健食</b><small>BY 614</small></span></div>
        <div class="streak"><i>12</i>连续 12 天</div>
      </div>
      <div class="week">
        <div class="day" data-press>一<b>3</b><i></i></div><div class="day" data-press>二<b>4</b><i></i></div><div class="day on" data-press>今天<b>5</b><i></i></div>
        <div class="day future">四<b>6</b><i></i></div><div class="day future">五<b>7</b><i></i></div><div class="day future">六<b>8</b><i></i></div><div class="day future">日<b>9</b><i></i></div>
      </div>

      <section class="hero">
        <div class="donut"><svg viewBox="0 0 228 228" data-donut aria-label="今日热量与三大营养素"></svg>
          <div class="disc"><div class="lab">还能吃</div><div class="big num" data-left>825</div><div class="u">KCAL</div></div></div>
        <div class="eaten">已吃 <b data-eaten>1175</b> / 目标 <b>2000</b> kcal</div>
        <div class="macros" data-macros></div>
      </section>

      <div class="coach" data-press><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.6L12 15l-1.8-4.4L5.5 9l4.7-1.4Z"/></svg></span><p data-say>午饭吃得不错。晚上补点蛋白质（还差 76 g），今天就圆满了。</p><span class="arrow">›</span></div>

      <div class="chips">
        <div class="chip"><div><div class="t" style="color:var(--water)">饮水</div><div class="v num"><span data-water>1250</span><small> ml</small></div></div><div class="btn" style="background:var(--water)" data-press data-addwater>+250ml</div></div>
        <div class="chip"><div><div class="t" style="color:var(--weight)">体重</div><div class="v num">66.4<small> kg</small></div></div><div class="btn" style="background:var(--weight)" data-press>更新</div></div>
      </div>

      <section class="card"><h3>今日任务<span data-done>完成 1/4</span></h3><div class="tgrid" data-tasks></div></section>
      <section class="card"><h3>今天吃的<span data-count>4 样</span></h3><div data-meals></div></section>
    </div>

    <nav class="nav">
      <span class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/></svg>今天</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 19V11M10 19V5M16 19v-6M21 19H3"/></svg>趋势</span>
      <div class="plus" data-press data-open="dinner" aria-label="记一笔"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 4h14v16H5zM5 9h14"/></svg>食物库</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6" stroke-linecap="round"/></svg>我的</span>
    </nav>

    <div class="backdrop" data-backdrop></div>
    <div class="sheet" data-sheet>
      <span class="grip" data-grip></span>
      <h4 data-grip>记一笔</h4>
      <div class="mt" data-mt></div>
      <div class="ways">
        <div class="way main" data-press><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><div>拍照识别<small>AI 估热量</small></div></div>
        <div class="way" data-press><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M5 4h14v16H5zM5 9h14"/></svg><div>收藏库<small>常吃的</small></div></div>
        <div class="way" data-press><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg><div>手动<small>自己填</small></div></div>
      </div>
      <div class="qh">常吃 · 点一下就记</div>
      <div data-quick></div>
    </div>
    <div class="toast" data-toast></div>
  </div>
</template>

<script src="shared.js"></script>
<script>
const ICON = {
  breakfast: '<svg viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round"><path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM16 10h2a2 2 0 0 1 0 4h-2M8 3v3M12 3v3"/></svg>',
  lunch: '<svg viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  snack: '<svg viewBox="0 0 24 24" fill="none" stroke="#f43f5e" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9 9h.01M14 8h.01M15 13h.01M9.5 14.5h.01"/></svg>',
  dinner: '<svg viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2.2" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>',
};
const DOT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="12" cy="12" r="5"/></svg>';
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const STRONG = new Set(['水煮蛋 ×2', '鸡胸肉饭', '香煎三文鱼']);
const MACROS = [
  { key: 'protein', name: '蛋白质', max: 150, kcalPer: 4, c: 'var(--protein)', grad: ['#c084fc', '#7e22ce'], bg: '#f1e8fd' },
  { key: 'carbs', name: '碳水', max: 200, kcalPer: 4, c: 'var(--carbs)', grad: ['#60a5fa', '#1d4ed8'], bg: '#e6effd' },
  { key: 'fat', name: '脂肪', max: 65, kcalPer: 9, c: 'var(--fat)', grad: ['#fb923c', '#c2410c'], bg: '#fdeee3' },
];

function mount(host, { label, openSheet = false } = {}) {
  const { phone, spring, pressable, pop, sheet, eaten, mealKcal, tasks, QUICK, initialState } = GYM;
  const s = initialState(); s.water = 1250;
  const p = phone({ label });
  host.appendChild(p.wrap);
  p.content.appendChild(document.getElementById('app').content.cloneNode(true));
  const $ = (q) => p.content.querySelector(q);
  pressable(p.content);

  /* ---- 圆环：整圈 = 目标；已吃部分按三大营养素的热量分段，段间留小缝，没吃的留灰 ---- */
  const svg = $('[data-donut]'); const uid = Math.random().toString(36).slice(2, 7);
  const R = 98, W = 22, C = 2 * Math.PI * R, GAP = 6;
  svg.innerHTML = `<defs>${MACROS.map((m) => `<linearGradient id="g-${m.key}-${uid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${m.grad[0]}"/><stop offset="1" stop-color="${m.grad[1]}"/></linearGradient>`).join('')}</defs>
    <circle cx="114" cy="114" r="${R}" fill="none" stroke="#edf0ee" stroke-width="${W}"/>
    ${MACROS.map((m) => `<circle data-seg="${m.key}" cx="114" cy="114" r="${R}" fill="none" stroke="url(#g-${m.key}-${uid})" stroke-width="${W}" stroke-linecap="round" transform="rotate(-90 114 114)"/>`).join('')}`;
  // 每段的热量 → 弧长；整圈 = 目标热量（超了就按实际总量画满）
  const segVals = Object.fromEntries(MACROS.map((m) => [m.key, s[m.key] * m.kcalPer]));
  function drawDonut() {
    const total = MACROS.reduce((a, m) => a + segVals[m.key], 0);
    const full = Math.max(s.goal, total);
    let start = 0;
    MACROS.forEach((m) => {
      const len = Math.max(0, segVals[m.key] / full * C - GAP);
      const seg = svg.querySelector(`[data-seg="${m.key}"]`);
      seg.setAttribute('stroke-dasharray', `${len} ${C}`);
      seg.setAttribute('stroke-dashoffset', String(-start));
      start += segVals[m.key] / full * C;
    });
  }
  const segSprings = Object.fromEntries(MACROS.map((m) => [m.key, spring(segVals[m.key], (x) => { segVals[m.key] = x; drawDonut(); }, { stiffness: 110, damping: 16 })]));

  // 三大营养素：沿用原来的「差 75g」
  $('[data-macros]').innerHTML = MACROS.map((m) => `
    <div class="ms"><div class="n"><i style="background:${m.bg};color:${m.c}">${DOT}</i>${m.name}</div>
      <div class="bar"><i data-mb="${m.key}" style="background:${m.c}"></i></div>
      <div class="v"><b class="num" data-mv="${m.key}"></b><em> / ${m.max}g</em><small data-mg="${m.key}"></small></div></div>`).join('');
  const macroSprings = Object.fromEntries(MACROS.map((m) => [m.key, spring(s[m.key], (x) => {
    $(`[data-mv="${m.key}"]`).textContent = Math.round(x * 10) / 10;
    $(`[data-mb="${m.key}"]`).style.width = Math.min(100, x / m.max * 100) + '%';
    const d = Math.round(x - m.max), g = $(`[data-mg="${m.key}"]`);
    g.textContent = d > 0 ? `超 ${d}g` : `差 ${-d}g`; g.classList.toggle('over', d > 0);
  })]));

  const leftEl = $('[data-left]');
  const big = spring(eaten(s), (x) => { const l = s.goal - x; leftEl.textContent = l >= 0 ? Math.round(l) : '+' + Math.round(-l); }, { stiffness: 120, damping: 17 });
  const waterEl = $('[data-water]'); const water = spring(s.water, (x) => (waterEl.textContent = Math.round(x)));

  /* ---- 任务 2×2 ---- */
  const TC = { protein: 'var(--protein)', water: 'var(--water)', meals: 'var(--emerald)', weight: 'var(--weight)' };
  const tS = {};
  function renderTasks(first) {
    const list = tasks(s);
    if (first) {
      $('[data-tasks]').innerHTML = list.map((t) => `<div class="tile" data-press data-task="${t.key}"><div class="n">${t.name}</div>
        <div class="v num"><span data-tv></span><em>${t.key === 'weight' ? '' : ' / ' + t.max + (t.unit ? ' ' + t.unit : '')}</em></div>
        <div class="tr"><i data-tb style="background:${TC[t.key]}"></i></div><span class="mark" data-mark>+</span></div>`).join('');
      list.forEach((t) => { const el = $(`[data-task="${t.key}"]`); tS[t.key] = spring(t.v, (x) => { el.querySelector('[data-tv]').textContent = t.fmt(x); el.querySelector('[data-tb]').style.width = Math.min(100, x / t.max * 100) + '%'; }, { stiffness: 160, damping: 15 }); });
    }
    let done = 0;
    list.forEach((t) => {
      const el = $(`[data-task="${t.key}"]`), ok = t.v >= t.max;
      if (ok) done++;
      if (ok && !el.classList.contains('done') && !first) { pop(el); toast(`${t.name} · 完成`); }
      el.classList.toggle('done', ok); el.querySelector('[data-mark]').innerHTML = ok ? CHECK : '+';
      tS[t.key](t.v);
    });
    $('[data-done]').textContent = `完成 ${done}/4`;
  }

  /* ---- 今天吃的：照片 + 名字 + 热量 ---- */
  function renderMeals() {
    $('[data-count]').textContent = s.meals.reduce((a, m) => a + m.items.length, 0) + ' 样';
    $('[data-meals]').innerHTML = s.meals.map((m) => `<div class="meal-g">
      <div class="meal-h">${ICON[m.key]}${m.name}<span class="sum">${m.items.length ? mealKcal(m) + ' kcal' : ''}</span><span class="add" data-press data-open="${m.key}">+</span></div>
      ${m.items.length ? m.items.map((i) => `<div class="food" data-press><div class="pic"><img class="ph" src="${i.img}" alt="${i.n}"></div>
        <div class="n">${i.n}${STRONG.has(i.n) ? '<span class="tag">强烈推荐</span>' : ''}</div><div class="k num">${i.k}</div></div>`).join('')
        : '<div class="empty-meal">还没记 · 建议不超过 700 kcal</div>'}</div>`).join('');
  }

  function toast(msg) { const t = $('[data-toast]'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1700); }
  function say() {
    const left = s.goal - eaten(s), lack = Math.round(150 - s.protein);
    $('[data-say]').textContent = left < 0 ? `今天多吃了 ${-left} kcal，没关系，明天清淡一点就好。`
      : s.meals[3].items.length ? (lack > 0 ? `晚饭记上了，还剩 ${left} kcal。蛋白质还差 ${lack} g。` : `蛋白质够了，还剩 ${left} kcal，今天做得很好。`)
      : `午饭吃得不错。晚上补点蛋白质（还差 ${lack} g），今天就圆满了。`;
  }
  function refresh() {
    big(eaten(s)); $('[data-eaten]').textContent = eaten(s);
    MACROS.forEach((m) => { segSprings[m.key](s[m.key] * m.kcalPer); macroSprings[m.key](s[m.key]); });
    water(s.water); renderMeals(); renderTasks(); say();
  }

  /* ---- 记一笔 ---- */
  const sh = sheet(p.screen, $('[data-sheet]'), $('[data-backdrop]'));
  let target = 3;
  function openFor(key) {
    target = Math.max(0, s.meals.findIndex((m) => m.key === key));
    $('[data-mt]').innerHTML = s.meals.map((m, i) => `<div data-press data-mti="${i}" class="${i === target ? 'on' : ''}">${ICON[m.key]}${m.name}</div>`).join('');
    sh.show();
  }
  $('[data-quick]').innerHTML = QUICK.map((q, i) => `<div class="quick" data-press data-q="${i}"><div class="pic"><img class="ph" src="${q.img}" alt=""></div><div class="n">${q.n}<small>蛋白质 ${q.p} g</small></div><div class="k num">${q.k}</div><div class="go">+</div></div>`).join('');

  p.content.addEventListener('click', (e) => {
    const op = e.target.closest('[data-open]'); if (op) { openFor(op.dataset.open); return; }
    const mt = e.target.closest('[data-mti]'); if (mt) { openFor(s.meals[+mt.dataset.mti].key); return; }
    if (e.target.closest('[data-addwater]')) { s.water += 250; s.cups = Math.min(8, s.cups + 1); refresh(); return; }
    const tile = e.target.closest('[data-task]');
    if (tile) {
      const key = tile.dataset.task;
      if (key === 'protein') s.protein = Math.min(150, Math.round((s.protein + 25) * 10) / 10);
      else if (key === 'water') { s.cups = Math.min(8, s.cups + 1); s.water += 250; }
      else if (key === 'meals') { openFor('dinner'); return; }
      else return;
      refresh(); return;
    }
    const q = e.target.closest('[data-q]');
    if (q) {
      const item = QUICK[+q.dataset.q];
      s.meals[target].items.push({ n: item.n, k: item.k, img: item.img });
      s.protein = Math.round((s.protein + item.p) * 10) / 10;
      s.fat = Math.round((s.fat + item.k * 0.3 / 9) * 10) / 10; s.carbs = Math.round((s.carbs + item.k * 0.25 / 4) * 10) / 10;
      sh.hide(); setTimeout(() => { refresh(); toast(`记上了 · ${item.n} ${item.k} kcal`); }, 200);
    }
  });

  renderMeals(); renderTasks(true); refresh();
  if (openSheet) setTimeout(() => openFor('dinner'), 500);
}
mount(document.getElementById('main'), { label: '首页 · 可以点' });
mount(document.getElementById('second'), { label: '记一笔（玻璃弹层）', openSheet: true });
</script>
</body>
</html>
