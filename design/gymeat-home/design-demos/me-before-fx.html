<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>健食 · 我的</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
/*
  我的：原来「设置」弹窗、头部登录 / 退出、退出确认弹窗的功能都搬到这一页，原地展开，不弹窗。
  保留：Google 登录 / 头像 / 退出（退出会清这台手机的缓存）、增肌 / 减脂 / 维持、三大营养素目标（热量自动算）、
  导出 / 导入备份、版本号。AI 引擎和 Key 那一块等 AI 重做时再放。
*/
:root {
  --bg: #f3f5f4; --card: #fff; --ink: #121615; --sub: #5a6360; --faint: #6e7774; --line: #eef1f0;
  --emerald: #10b981; --emerald-deep: #0b7a55; --emerald-soft: #e7f7f0;
  --coral: #f0505a; --coral-soft: #fde4e1;
  --num: "Inter", "Noto Sans SC", sans-serif;
  --pad: 22px; --gap: 28px; --in: 22px;
}
body { background: #dfe3e1; color: var(--ink); font-family: "Noto Sans SC", sans-serif; min-height: 100vh; }
.board { max-width: 1260px; margin: 0 auto; padding: 44px 32px 80px; display: grid; grid-template-columns: 320px auto auto; gap: 44px; align-items: start; }
.board-h { padding-top: 24px; }
.board-h h1 { font-size: 40px; font-weight: 700; }
.board-h h1 small { display: block; font-size: 17px; font-weight: 700; color: var(--sub); margin-top: 6px; }
.board-h p { margin-top: 16px; font-size: 14.5px; line-height: 1.75; color: #3d4441; }
.board-h h2 { font-size: 14px; font-weight: 700; margin-top: 20px; }
.board-h ul { list-style: none; font-size: 13.5px; line-height: 1.95; color: #3d4441; margin-top: 4px; }
.board-h ul b { color: var(--emerald-deep); }
.second { margin-top: 110px; transform: scale(.86); transform-origin: top center; }

.app { position: absolute; inset: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans SC", sans-serif; }
.scroll { position: absolute; inset: 0; overflow-y: auto; padding: 44px var(--pad) 190px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.num { font-family: var(--num); }
.stack > * + * { margin-top: var(--gap); }
button { font-family: inherit; cursor: pointer; }
.card { background: var(--card); border-radius: 28px; padding: var(--in); }
.card h3 { font-size: 17px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; }
.card h3 span { font-size: 12px; font-weight: 600; color: var(--sub); }

/* 头部 */
.th h1 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; padding-top: 6px; transform-origin: 0 60%; }
.me { display: flex; align-items: center; gap: 16px; }
.av { position: relative; width: 68px; height: 68px; border-radius: 50%; background: linear-gradient(140deg, #34d399, #059669); color: #fff; display: grid; place-items: center; font: 600 28px var(--num); box-shadow: 0 10px 24px -10px rgba(5,150,105,.6); flex: none; }
.av.guest { background: #e3e8e6; color: #8a938f; box-shadow: none; }
.av.guest svg { width: 32px; height: 32px; }
.av::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid rgba(16,185,129,.35); }
.av.guest::after { display: none; }
.who b { display: block; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.who small { display: block; font-size: 12.5px; color: var(--faint); margin-top: 2px; }
.sync { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; height: 28px; padding: 0 11px 0 9px; border-radius: 999px; background: var(--emerald-soft); color: var(--emerald-deep); font-size: 12px; font-weight: 600; border: 0; }
.sync svg { width: 14px; height: 14px; }
.sync.busy svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.sync.off { background: #eef2f0; color: var(--sub); }
.login { margin-top: 12px; height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--ink); color: #fff; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.login i { width: 20px; height: 20px; border-radius: 50%; background: #fff; color: var(--ink); display: grid; place-items: center; font: 700 12px var(--num); font-style: normal; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 22px; background: #fff; border-radius: 22px; padding: 16px 0; }
.stats div { text-align: center; }
.stats div + div { box-shadow: inset 1px 0 0 #edf1ef; }
.stats b { font: 600 26px var(--num); letter-spacing: -.03em; display: inline-flex; line-height: 1; }
.stats em { font-style: normal; font: 500 13px var(--num); color: var(--faint); margin-left: 2px; }
.stats small { display: block; font-size: 12px; color: var(--sub); margin-top: 6px; font-weight: 600; }
.stats .down b { color: var(--emerald-deep); }
.mile { margin-top: 14px; padding: 14px 16px; background: #fff; border-radius: 20px; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.mile .fl { width: 38px; height: 38px; border-radius: 12px; background: #fff3e8; display: grid; place-items: center; }
.mile .fl svg { width: 20px; height: 20px; color: #f2711c; }
.mile .t { font-size: 13.5px; font-weight: 600; display: flex; justify-content: space-between; }
.mile .t span { font: 600 12.5px var(--num); color: var(--faint); }
.mile .tr { height: 10px; border-radius: 999px; background: #eef2f0; box-shadow: inset 0 1px 2px rgba(16,20,19,.1); margin-top: 8px; padding: 1px; }
.mile .tr i { position: relative; display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #fdba74, #f2711c); box-shadow: 0 2px 6px -1px rgba(242,113,28,.45); transition: width 1s cubic-bezier(.3,1.2,.5,1); }
.mile .tr i::after { content: ''; position: absolute; right: 2px; top: 50%; width: 4px; height: 4px; margin-top: -2px; border-radius: 50%; background: rgba(255,255,255,.85); }

/* 目标 */
.seg { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); background: #e7ecea; border-radius: 999px; padding: 4px; box-shadow: inset 0 1px 2px rgba(16,20,19,.08); margin-top: 16px; }
.seg button { position: relative; z-index: 1; border: 0; background: none; font: 600 14px "Noto Sans SC", sans-serif; color: var(--sub); padding: 10px 0; border-radius: 999px; transition: color .3s; }
.seg button.on { color: #fff; }
.seg-pill { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(33.333% - 2.67px); border-radius: 999px; background: var(--ink); box-shadow: 0 4px 10px rgba(16,20,19,.2); }
.hint { margin-top: 10px; font-size: 12.5px; color: var(--sub); min-height: 20px; }
.kc { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 18px; padding-top: 18px; box-shadow: inset 0 1px 0 var(--line); }
.kc small { display: block; font-size: 12px; font-weight: 600; color: var(--faint); }
.kc b { font: 600 40px var(--num); letter-spacing: -.04em; display: inline-flex; line-height: 1; margin-top: 4px; }
.kc em { font-style: normal; font: 500 14px var(--num); color: var(--faint); margin-left: 4px; }
.kc .tag { font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--emerald-soft); color: var(--emerald-deep); }
.share { display: flex; gap: 3px; height: 8px; margin-top: 14px; }
.share i { display: block; height: 100%; border-radius: 999px; transition: flex-grow .5s cubic-bezier(.3,1.2,.5,1); }
.mrow { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; margin-top: 16px; }
.mrow .n { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.mrow .n i { width: 8px; height: 8px; border-radius: 50%; }
.mrow .n small { display: block; font-size: 11.5px; color: var(--faint); font-weight: 500; margin-top: 2px; }

/* − / + 小秤（同趋势页） */
.step { position: relative; display: flex; align-items: center; background: #f1f4f3; border-radius: 999px; padding: 4px; box-shadow: inset 0 1px 2px rgba(16,20,19,.08); }
.step button { position: relative; width: 38px; height: 38px; border-radius: 50%; border: 0; background: #fff; color: var(--ink); font: 600 20px var(--num); display: grid; place-items: center; box-shadow: 0 1px 3px rgba(16,20,19,.12); touch-action: none; transition: background .25s, color .25s, transform .4s cubic-bezier(.3,1.7,.5,1); }
.step button.down { transform: scale(.8); transition: transform 70ms ease-out, background .25s, color .25s; }
.step button.hold { background: var(--ink); color: #fff; }
.step button.hold::before { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid rgba(16,185,129,.7); animation: holdRing .6s ease-out infinite; }
@keyframes holdRing { from { transform: scale(.9); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }
.step .rip { position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 2px #10b981; pointer-events: none; }
.step .fly { position: absolute; top: -4px; font: 700 13px var(--num); color: var(--emerald-deep); pointer-events: none; white-space: nowrap; }
.step b { position: relative; min-width: 76px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.step b .v { font: 600 17px var(--num); display: inline-flex; align-items: flex-end; }
.step b .v em { font-style: normal; font-size: 12px; color: var(--faint); margin-left: 2px; }
.ruler { position: relative; width: 60px; height: 7px; background:
    repeating-linear-gradient(90deg, #7f8986 0 1.5px, transparent 1.5px 60px) 0 0 / auto 7px repeat-x,
    repeating-linear-gradient(90deg, #c3cbc8 0 1px, transparent 1px 6px) 0 100% / auto 4px repeat-x;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent); mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent); }
.ruler.anim { transition: background-position .45s cubic-bezier(.3,1.35,.5,1); }
.step b::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 2px; height: 10px; margin-left: -1px; border-radius: 1px; background: var(--mc, var(--emerald)); }

/* 列表行（数据 / 账号） */
.rows { margin-top: 8px; }
.row { position: relative; display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: center; padding: 12px 0; border: 0; background: none; width: 100%; text-align: left; color: var(--ink); }
.row + .row { box-shadow: inset 0 1px 0 var(--line); }
.row .ic { width: 40px; height: 40px; border-radius: 13px; background: #f1f4f3; display: grid; place-items: center; }
.row .ic svg { width: 20px; height: 20px; }
.row b { display: block; font-size: 15px; font-weight: 600; }
.row small { display: block; font-size: 12px; color: var(--faint); margin-top: 2px; }
.row .go { color: #a3aca8; } .row .go svg { width: 18px; height: 18px; display: block; }
.row .pb { position: absolute; left: 54px; right: 0; bottom: 4px; height: 3px; border-radius: 3px; background: #eef2f0; overflow: hidden; opacity: 0; transition: opacity .2s; }
.row .pb i { display: block; height: 100%; width: 0; background: var(--emerald); border-radius: 3px; }
.row.busy .pb { opacity: 1; }
.row .ok { width: 24px; height: 24px; border-radius: 50%; background: var(--emerald); color: #fff; display: none; place-items: center; }
.row .ok svg { width: 14px; height: 14px; }
.row.done .ok { display: grid; } .row.done .go { display: none; }
.row.out b { color: #c9323d; } .row.out .ic { background: var(--coral-soft); color: #c9323d; }
.inl { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s cubic-bezier(.3,1.1,.5,1); }
.inl > div { overflow: hidden; min-height: 0; }
.inl.open { grid-template-rows: 1fr; }
.confirm { margin: 4px 0 6px; padding: 16px; border-radius: 20px; background: #fff7f6; box-shadow: inset 0 0 0 1px #fbd5d0; }
.confirm p { font-size: 13.5px; line-height: 1.65; color: #4a2a2a; }
.confirm .bt { display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; margin-top: 14px; }
.confirm button { height: 46px; border-radius: 999px; border: 0; font-size: 14.5px; font-weight: 600; }
.confirm .no { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1px #ecd9d6; }
.confirm .yes { background: var(--coral); color: #fff; }
.foot { text-align: center; font-size: 12px; color: #9aa39f; font-weight: 600; }
.foot b { font-family: var(--num); font-weight: 600; }

/* 改了没存：底部浮起一条 */
.savebar { position: absolute; left: 14px; right: 14px; bottom: 100px; z-index: 19; display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 18px; border-radius: 22px; background: rgba(18,22,21,.92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); color: #fff; box-shadow: 0 16px 34px -12px rgba(16,20,19,.5); transform: translateY(140%); opacity: 0; transition: transform .5s cubic-bezier(.3,1.3,.5,1), opacity .25s; }
.savebar.on { transform: none; opacity: 1; }
.savebar span { flex: 1; font-size: 14px; font-weight: 600; } .savebar span small { display: block; font-size: 12px; color: #9fb3ab; font-weight: 500; margin-top: 1px; }
.savebar button { height: 42px; padding: 0 16px; border-radius: 999px; border: 0; font-size: 14px; font-weight: 600; }
.savebar .rv { background: rgba(255,255,255,.12); color: #fff; }
.savebar .sv { background: var(--emerald); color: #fff; }

/* 数字滚轮 */
.roll { display: inline-flex; height: 1em; line-height: 1; }
.roll .dg { display: inline-block; height: 1em; overflow: hidden; transition: width .45s cubic-bezier(.25,1.2,.4,1); }
.roll .strip { display: flex; flex-direction: column; transition: transform .6s cubic-bezier(.25,1.2,.4,1); }
.roll .strip i { font-style: normal; display: block; height: 1em; line-height: 1; width: max-content; }
.roll, .roll * { font-variant-numeric: proportional-nums !important; }

/* 顶栏 / 导航 / 提示 */
.topbar { position: absolute; left: 0; right: 0; top: 0; height: 86px; z-index: 18; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 12px; font-size: 16px; font-weight: 700; background: rgba(243,245,244,.78); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); box-shadow: 0 1px 0 rgba(0,0,0,.06); opacity: 0; transform: translateY(-8px); transition: opacity .25s, transform .35s cubic-bezier(.3,1.2,.5,1); pointer-events: none; }
.topbar.on { opacity: 1; transform: none; }
.nav { position: absolute; left: 0; right: 0; bottom: 0; height: 88px; display: grid; grid-template-columns: repeat(5, 1fr); padding-top: 10px; z-index: 20; background: rgba(255,255,255,.72); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); box-shadow: 0 -1px 0 rgba(0,0,0,.06); }
.nav span { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: #7a8481; }
.nav span.on { color: var(--ink); } .nav svg { width: 24px; height: 24px; }
.nav .plus { justify-self: center; width: 60px; height: 60px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; margin-top: -22px; box-shadow: 0 10px 24px rgba(16,20,19,.28); }
.toast { position: absolute; left: 50%; top: 52px; transform: translate(-50%, -110px); z-index: 50; padding: 10px 16px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 14px; font-weight: 600; white-space: nowrap; transition: transform .5s cubic-bezier(.3,1.5,.5,1); }
.toast.show { transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .roll .strip, .roll .dg, .inl, .savebar, .mile .tr i { transition: none; } .sync.busy svg { animation: none; } }
</style>
</head>
<body>
<div class="board">
  <div class="board-h">
    <h1>健食<small>我的 · 跟首页同一套</small></h1>
    <p>原来散在「设置」弹窗、顶部登录按钮、退出确认弹窗里的功能都搬到这一页：登录 / 头像 / 退出、增肌减脂维持、三大营养素目标（热量自动算）、导出导入备份、版本号。AI 引擎和 Key 等 AI 重做时再放。</p>
    <h2>可以点</h2>
    <ul>
      <li><b>同步状态</b>　点一下立即同步</li>
      <li><b>增肌 / 减脂 / 维持</b>　黑色滑块拉伸着滑过去</li>
      <li><b>− / +</b>　改每天的目标，热量跟着滚；改了会从底部浮起「保存 / 还原」</li>
      <li><b>导出 / 导入</b>　行里走进度条，完成打勾</li>
      <li><b>退出登录</b>　原地展开确认，不弹窗</li>
    </ul>
  </div>
  <div id="main"></div>
  <div id="second" class="second"></div>
</div>

<template id="app">
  <div class="app">
    <div class="scroll"><div class="stack">
      <div class="th"><h1>我的</h1></div>

      <section>
        <div class="me" data-me></div>
        <div class="stats">
          <div><b data-s1>0</b><em>天</em><small>连续打卡</small></div>
          <div><b data-s2>0</b><em>天</em><small>一共记了</small></div>
          <div class="down"><b data-s3>0</b><em>kg</em><small>体重 · 30 天</small></div>
        </div>
        <div class="mile"><span class="fl"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3.5 5 5.6 5 10.5A5 5 0 0 1 12 18a5 5 0 0 1-5-5.5c0-2.2 1.2-3.6 2.4-4.6.2 1.6 1 2.6 2 3C11 8 11.6 5 12 2Z"/></svg></span>
          <div><div class="t">再坚持 2 天，连续 14 天<span>12 / 14</span></div><div class="tr"><i data-mile></i></div></div></div>
      </section>

      <section class="card">
        <h3>我的目标<span>影响 AI 教练的建议</span></h3>
        <div class="seg" data-seg><i class="seg-pill" data-spill></i><button data-g="gain">增肌</button><button data-g="lose" class="on">减脂</button><button data-g="maintain">维持</button></div>
        <div class="hint" data-hint></div>
        <div class="kc"><div><small>每天热量 · 自动算</small><b data-kc>0</b><em>kcal</em></div><span class="tag" data-ktag>蛋白 30%</span></div>
        <div class="share"><i data-sp style="background:#f0505a"></i><i data-sc style="background:#f5a524"></i><i data-sf style="background:#16a394"></i></div>
        <div data-macros></div>
      </section>

      <section class="card">
        <h3>数据<span>换手机也不丢</span></h3>
        <div class="rows">
          <button class="row" data-io="export"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7 9l5-5 5 5M5 15v4h14v-4"/></svg></span><span><b>导出备份</b><small data-ios="export">记录、食物库、体重、目标存成一个文件</small></span><span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></span><span class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg></span><span class="pb"><i></i></span></button>
          <button class="row" data-io="import"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 15v4h14v-4"/></svg></span><span><b>导入备份</b><small data-ios="import">已有的记录不会被覆盖</small></span><span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></span><span class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg></span><span class="pb"><i></i></span></button>
        </div>
      </section>

      <section class="card" data-acct>
        <h3>账号</h3>
        <div class="rows">
          <button class="row out" data-out><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg></span><span><b>退出登录</b><small>换账号或不想同步时用</small></span><span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></span></button>
        </div>
        <div class="inl" data-cf><div><div class="confirm">
          <p>退出后，这台手机上的缓存会清掉；云端的记录都还在，重新登录就回来了。</p>
          <div class="bt"><button data-press class="no" data-no>先不退</button><button data-press class="yes" data-yes>确认退出</button></div>
        </div></div></div>
      </section>

      <div class="foot">健食 GYMEAT · <b>v1.11</b> · by 614</div>
    </div></div>

    <div class="savebar" data-bar><span>目标改了<small data-bars>还没保存</small></span><button data-press class="rv" data-revert>还原</button><button data-press class="sv" data-savego>保存</button></div>
    <div class="topbar" data-topbar>我的</div>
    <nav class="nav">
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/></svg>今天</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 19V11M10 19V5M16 19v-6M21 19H3"/></svg>趋势</span>
      <div class="plus" data-press aria-label="记一笔"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 4h14v16H5zM5 9h14"/></svg>食物库</span>
      <span class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6" stroke-linecap="round"/></svg>我的</span>
    </nav>
    <div class="toast" data-toast></div>
  </div>
</template>

<script src="shared.js"></script>
<script>
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MAC = [
  { key: 'p', name: '蛋白质', per: 4, color: '#f0505a', note: '体重 × 2.2 左右' },
  { key: 'c', name: '碳水', per: 4, color: '#f5a524', note: '练得多的日子可以多一点' },
  { key: 'f', name: '脂肪', per: 9, color: '#16a394', note: '别低于 40 g' },
];
const HINT = { gain: '增肌：热量比消耗多一点，蛋白质要够', lose: '减脂：热量比消耗少一点，蛋白质要高', maintain: '维持：吃多少用多少，三大营养素均衡' };
const GOALS = ['gain', 'lose', 'maintain'];

function roll(el, text) {
  const chars = [...text], sig = chars.map((c) => (/\d/.test(c) ? 'd' : c)).join('');
  if (el._sig !== sig) {
    el._sig = sig; el.classList.add('roll');
    el.innerHTML = chars.map((c) => /\d/.test(c) ? `<span class="dg"><span class="strip">${[...'0123456789'].map((d) => `<i>${d}</i>`).join('')}</span></span>` : `<span>${c}</span>`).join('');
  }
  const strips = el.querySelectorAll('.strip'); let k = 0;
  chars.forEach((c) => {
    if (!/\d/.test(c)) return;
    const st = strips[k++], w = st.children[+c].offsetWidth;
    st.style.transform = `translateY(${-c}em)`;
    st.parentElement.style.width = w ? w + 'px' : '';
  });
}

function mount(host, { label, guest = false } = {}) {
  const { phone, pressable, pop } = GYM;
  const p = phone({ label });
  host.appendChild(p.wrap);
  p.content.appendChild(document.getElementById('app').content.cloneNode(true));
  const $ = (q) => p.content.querySelector(q);
  pressable(p.content);
  const toast = (msg) => { const t = $('[data-toast]'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800); };

  /* ---------- 头部：登录 / 没登录 ---------- */
  function renderMe(isGuest) {
    $('[data-me]').innerHTML = isGuest
      ? `<div class="av guest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6" stroke-linecap="round"/></svg></div>
         <div class="who"><b>还没登录</b><small>记录只存在这台手机上</small><button class="login" data-press data-login><i>G</i>用 Google 登录，换手机也不丢</button></div>`
      : `<div class="av">A</div>
         <div class="who"><b>614</b><small>Google 账号</small><button class="sync" data-press data-sync><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-14 5.3M4 12a8 8 0 0 1 14-5.3M18 3v4h-4M6 21v-4h4"/></svg><span data-synct>已同步 · 刚刚</span></button></div>`;
    $('[data-acct]').style.display = isGuest ? 'none' : '';
  }
  renderMe(guest);

  /* ---------- 数字：进来时数上去 ---------- */
  function countTo(el, to, dec = 0, sign = '') {
    if (REDUCED) { roll(el, sign + to.toFixed(dec)); return; }
    roll(el, sign + (0).toFixed(dec));
    setTimeout(() => roll(el, sign + to.toFixed(dec)), 250);
  }
  countTo($('[data-s1]'), 12); countTo($('[data-s2]'), 86); countTo($('[data-s3]'), 1.2, 1, '−');
  setTimeout(() => ($('[data-mile]').style.width = 12 / 14 * 100 + '%'), 300);

  /* ---------- 目标 ---------- */
  const saved = { g: 'lose', p: 150, c: 200, f: 65 };
  const draft = { ...saved };
  $('[data-macros]').innerHTML = MAC.map((m) => `<div class="mrow"><div class="n"><i style="background:${m.color}"></i><div>${m.name}<small>${m.note}</small></div></div>
    <div class="step" style="--mc:${m.color}"><button data-step="-1" data-k="${m.key}" aria-label="减 5 克">−</button><b><span class="v"><span data-v="${m.key}"></span><em>g</em></span><i class="ruler" data-ruler="${m.key}"></i></b><button data-step="1" data-k="${m.key}" aria-label="加 5 克">+</button></div></div>`).join('');
  function draw() {
    MAC.forEach((m) => {
      roll($(`[data-v="${m.key}"]`), String(draft[m.key]));
      const x = 30 - draft[m.key] * 1.2; $(`[data-ruler="${m.key}"]`).style.backgroundPosition = `${x}px 0, ${x}px 100%`;
    });
    const kp = draft.p * 4, kc = draft.c * 4, kf = draft.f * 9, tot = kp + kc + kf;
    roll($('[data-kc]'), String(tot));
    $('[data-sp]').style.flexGrow = kp; $('[data-sc]').style.flexGrow = kc; $('[data-sf]').style.flexGrow = kf;
    $('[data-ktag]').textContent = `蛋白 ${Math.round(kp / tot * 100)}% · 碳水 ${Math.round(kc / tot * 100)}% · 脂肪 ${Math.round(kf / tot * 100)}%`;
    $('[data-hint]').textContent = HINT[draft.g];
    const dirty = ['g', 'p', 'c', 'f'].some((k) => draft[k] !== saved[k]);
    $('[data-bar]').classList.toggle('on', dirty);
    if (dirty) $('[data-bars]').textContent = `每天 ${tot} kcal · 还没保存`;
  }
  function moveSeg(to, from) {
    const pill = $('[data-spill]'), w = pill.offsetWidth, a = GOALS.indexOf(from) * w, z = GOALS.indexOf(to) * w;
    pill.style.transform = `translateX(${z}px)`;
    if (from && from !== to && !REDUCED) pill.animate([{ transform: `translateX(${a}px)` }, { transform: `translateX(${(a + z) / 2}px) scaleX(1.25)`, offset: .45 }, { transform: `translateX(${z}px)` }], { duration: 480, easing: 'cubic-bezier(.3,1.15,.5,1)' });
    p.content.querySelectorAll('[data-g]').forEach((b) => b.classList.toggle('on', b.dataset.g === to));
  }
  moveSeg(draft.g);
  draw(); requestAnimationFrame(() => p.content.querySelectorAll('.ruler').forEach((r) => r.classList.add('anim')));

  // − / +：每步 5 g，按住加速
  function stepFx(btn, dir, holding) {
    if (REDUCED) return;
    const rip = document.createElement('span'); rip.className = 'rip'; btn.appendChild(rip);
    rip.animate([{ transform: 'scale(.7)', opacity: .7 }, { transform: 'scale(1.9)', opacity: 0 }], { duration: 520, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => rip.remove();
    if (holding) return;
    const st = btn.parentElement, f = document.createElement('span'); f.className = 'fly'; f.textContent = `${dir > 0 ? '+' : '−'}5 g`;
    f.style.left = btn.offsetLeft + btn.offsetWidth / 2 + 'px'; st.appendChild(f);
    f.animate([{ transform: 'translate(-50%, 0) scale(.6)', opacity: 0 }, { transform: 'translate(-50%, -16px) scale(1.05)', opacity: 1, offset: .3 }, { transform: 'translate(-50%, -32px) scale(1)', opacity: 0 }], { duration: 720, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => f.remove();
  }
  const bump = (k, dir) => { draft[k] = Math.max(0, Math.min(500, draft[k] + dir * 5)); draw(); };
  p.content.addEventListener('pointerdown', (e) => {
    const btn = e.target.closest('[data-step]'); if (!btn) return;
    try { btn.setPointerCapture(e.pointerId); } catch (_) {}
    const dir = +btn.dataset.step, k = btn.dataset.k; btn.classList.add('down');
    bump(k, dir); stepFx(btn, dir, false);
    let n = 0, tm = 0;
    const rep = () => { btn.classList.add('hold'); bump(k, dir); stepFx(btn, dir, true); n++; tm = setTimeout(rep, n > 6 ? 80 : 140); };
    tm = setTimeout(rep, 400);
    const end = () => { clearTimeout(tm); btn.classList.remove('down', 'hold'); btn.removeEventListener('pointerup', end); btn.removeEventListener('pointercancel', end); };
    btn.addEventListener('pointerup', end); btn.addEventListener('pointercancel', end);
  });

  /* ---------- 导出 / 导入：行里走进度 ---------- */
  function runIO(row, kind) {
    if (row.classList.contains('busy')) return;
    row.classList.remove('done'); row.classList.add('busy');
    const bar = row.querySelector('.pb i'), sm = row.querySelector('[data-ios]');
    sm.textContent = kind === 'export' ? '正在打包…' : '正在读取文件…';
    bar.style.transition = 'none'; bar.style.width = '0';
    requestAnimationFrame(() => { bar.style.transition = 'width 1.1s cubic-bezier(.5,0,.2,1)'; bar.style.width = '100%'; });
    setTimeout(() => {
      row.classList.remove('busy'); row.classList.add('done'); pop(row.querySelector('.ok'));
      sm.textContent = kind === 'export' ? '已存好 gymeat-2026-11-05.json' : '导入了 12 条记录，目标已恢复';
      toast(kind === 'export' ? '备份导出好了' : '导入好了 · 12 条记录');
    }, REDUCED ? 200 : 1250);
  }

  /* ---------- 点击 ---------- */
  p.content.addEventListener('click', (e) => {
    const t = e.target;
    const g = t.closest('[data-g]'); if (g) { if (g.dataset.g !== draft.g) { const from = draft.g; draft.g = g.dataset.g; moveSeg(draft.g, from); draw(); } return; }
    if (t.closest('[data-sync]')) {
      const s = $('[data-sync]'); if (s.classList.contains('busy')) return;
      s.classList.add('busy'); $('[data-synct]').textContent = '同步中…';
      setTimeout(() => { s.classList.remove('busy'); $('[data-synct]').textContent = '已同步 · 刚刚'; pop(s); }, 1200);
      return;
    }
    if (t.closest('[data-login]')) { renderMe(false); pop($('.av')); toast('登录好了 · 记录开始同步'); return; }
    const io = t.closest('[data-io]'); if (io) { runIO(io, io.dataset.io); return; }
    if (t.closest('[data-out]')) { $('[data-cf]').classList.toggle('open'); setTimeout(() => $('[data-cf]').scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 200); return; }
    if (t.closest('[data-no]')) { $('[data-cf]').classList.remove('open'); return; }
    if (t.closest('[data-yes]')) { $('[data-cf]').classList.remove('open'); renderMe(true); $('.scroll').scrollTo({ top: 0, behavior: 'smooth' }); toast('已退出 · 这台手机的缓存清掉了'); return; }
    if (t.closest('[data-revert]')) { const from = draft.g; Object.assign(draft, saved); moveSeg(draft.g, from); draw(); toast('还原了'); return; }
    if (t.closest('[data-savego]')) {
      if (!(draft.p * 4 + draft.c * 4 + draft.f * 9)) { toast('目标不能都是 0'); return; }
      Object.assign(saved, draft); draw(); pop($('[data-kc]')); toast('目标保存好了'); return;
    }
    if (t.closest('.plus')) toast('记一笔 · 在首页演示');
  });

  /* ---------- 滚动：大标题收成顶栏 ---------- */
  const sc = $('.scroll'), topbar = $('[data-topbar]'), h1 = $('.th h1');
  sc.addEventListener('scroll', () => {
    const y = sc.scrollTop, k = Math.min(1, Math.max(0, y / 48));
    topbar.classList.toggle('on', y > 44);
    h1.style.opacity = 1 - k; h1.style.transform = `scale(${1 - k * .12}) translateY(${-k * 6}px)`;
  }, { passive: true });
  return { p, $, draft, draw, moveSeg };
}

mount(document.getElementById('main'), { label: '我的 · 可以点' });
mount(document.getElementById('second'), { label: '没登录的样子', guest: true });
</script>
</body>
</html>
