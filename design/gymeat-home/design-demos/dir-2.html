<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>健食 · 方向二 一顿一格</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;700;800;900&family=Noto+Sans+SC:wght@500;700;900&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
/*
  方向二｜现实参照 Monzo（友好金融）
  借：顶部满版品牌色放大数字 + 三个胶囊动作；白色大圆角面板像抽屉抬起；2 列大圆角「罐子」。
  色：番茄红 #FF5A3C（红橙促食欲，取自番茄与三文鱼）+ 深海军蓝 #14233C 字；任务罐子用粉彩。
*/
:root { --red: #ff5a3c; --red-deep: #e2401f; --navy: #14233c; --grey: #f3f4f7; --line: #e9eaef; --sub: #5d6577; }
body { background: #f6efe9; color: var(--navy); font-family: "Noto Sans SC", sans-serif; min-height: 100vh; }
.board { max-width: 1240px; margin: 0 auto; padding: 48px 32px 80px; display: grid; grid-template-columns: auto 1fr auto; gap: 44px; align-items: start; }
.board-h { padding-top: 30px; }
.board-h .name { font: 900 60px Figtree; letter-spacing: -.035em; line-height: .95; color: var(--red); }
.board-h .name small { display: block; font: 900 26px "Noto Sans SC"; color: var(--navy); margin-top: 10px; letter-spacing: 0; }
.board-h p { margin-top: 22px; font-size: 15px; line-height: 1.75; color: #3e4659; max-width: 330px; }
.board-h ul { margin-top: 20px; list-style: none; font-size: 14px; line-height: 2; color: #3e4659; }
.board-h ul b { color: var(--red); }
.zoom { margin-top: 36px; background: #fff; border-radius: 30px; padding: 18px; width: 330px; box-shadow: 0 20px 50px rgba(20,35,60,.10); }
.zoom .cap { font: 700 12px "Noto Sans SC"; color: var(--sub); margin-bottom: 10px; }
.second { margin-top: 140px; transform: scale(.86); transform-origin: top center; }

/* ---------- App ---------- */
.app { position: absolute; inset: 0; background: var(--red); color: var(--navy); font-family: Figtree, "Noto Sans SC", sans-serif; }
.top { padding: 46px 22px 0; color: #fff; }
.top .row1 { display: flex; justify-content: space-between; align-items: center; }
.top .lab { font: 700 16px "Noto Sans SC"; opacity: .92; }
.top .streak { font: 900 14px "Noto Sans SC"; background: rgba(20,35,60,.22); border-radius: 999px; padding: 6px 12px 6px 6px; display: flex; gap: 6px; align-items: center; }
.top .streak i { width: 22px; height: 22px; border-radius: 50%; background: #fff; color: var(--red); font: 900 12px Figtree; font-style: normal; display: grid; place-items: center; }
.top .big { font-size: 92px; font-weight: 900; letter-spacing: -.04em; line-height: 1; margin-top: 4px; }
.top .big small { font-size: 24px; font-weight: 800; letter-spacing: 0; margin-left: 4px; }
.top .sub { font: 700 13px "Noto Sans SC"; opacity: .85; margin-top: 2px; }
.pills { display: flex; gap: 8px; margin-top: 16px; }
.pill { background: rgba(255,255,255,.2); color: #fff; border-radius: 999px; padding: 10px 14px; font: 800 14px "Noto Sans SC"; display: flex; align-items: center; gap: 6px; transition: background .2s; }
.pill.is-pressed { background: rgba(255,255,255,.34); }
.pill.main { background: #fff; color: var(--red); }
.pill svg { width: 17px; height: 17px; }
.drawer { position: absolute; left: 0; right: 0; top: 286px; bottom: 0; background: #fff; border-radius: 34px 34px 0 0; padding: 18px 16px 0; box-shadow: 0 -10px 30px rgba(0,0,0,.08); }
.sec { display: flex; justify-content: space-between; align-items: baseline; font: 900 17px "Noto Sans SC"; margin: 0 6px 10px; }
.sec span { font: 700 13px "Noto Sans SC"; color: var(--sub); }
.quests { display: flex; gap: 8px; margin: 0 -16px 18px; padding: 0 16px; overflow-x: auto; scrollbar-width: none; }
.quests::-webkit-scrollbar { display: none; }
.q { flex: none; width: 138px; border-radius: 24px; padding: 12px 14px 14px; position: relative; transition: background .3s, color .3s; }
.q .n { font: 800 13px "Noto Sans SC"; }
.q .v { font: 900 26px Figtree; letter-spacing: -.02em; margin-top: 2px; } .q .v small { font-size: 13px; font-weight: 700; opacity: .6; }
.q .tr { height: 6px; border-radius: 999px; background: rgba(20,35,60,.12); margin-top: 8px; overflow: hidden; } .q .tr i { display: block; height: 100%; background: var(--navy); border-radius: 999px; }
.q .chk { position: absolute; right: 10px; top: 10px; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.7); display: grid; place-items: center; font: 900 16px Figtree; }
.q.done { background: var(--navy) !important; color: #fff; } .q.done .tr { background: rgba(255,255,255,.2); } .q.done .tr i { background: #7cf0b0; } .q.done .chk { background: #7cf0b0; color: var(--navy); }
.pots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pot { border-radius: 26px; overflow: hidden; background: var(--grey); position: relative; }
.pot .pic { height: 112px; }
.pot .t { padding: 9px 12px 12px; display: flex; justify-content: space-between; align-items: end; }
.pot .t b { font: 900 14px "Noto Sans SC"; display: block; } .pot .t small { font: 600 12px "Noto Sans SC"; color: var(--sub); }
.pot .t .k { font: 900 24px Figtree; letter-spacing: -.02em; }
.pot .cnt { position: absolute; left: 10px; top: 10px; background: rgba(20,35,60,.72); color: #fff; font: 800 11px "Noto Sans SC"; border-radius: 999px; padding: 3px 8px; }
.pot.add { background: #fff; border: 3px dashed #f0c2b6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--red); font: 900 15px "Noto Sans SC"; min-height: 175px; }
.pot.add .plus { width: 44px; height: 44px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font: 900 26px Figtree; }
.pot.add small { color: var(--sub); font: 700 12px "Noto Sans SC"; }
.nav { position: absolute; left: 0; right: 0; bottom: 0; height: 88px; background: rgba(255,255,255,.94); backdrop-filter: blur(16px); box-shadow: 0 -1px 0 var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding-top: 10px; z-index: 20; }
.nav span { text-align: center; color: #8b92a3; font: 700 11px "Noto Sans SC"; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.nav span.on { color: var(--red); }
.nav svg { width: 24px; height: 24px; }
.nav .plus { justify-self: center; width: 58px; height: 58px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; margin-top: -24px; box-shadow: 0 10px 24px rgba(20,35,60,.3); }

/* 弹层 */
.sheet { background: #fff; border-radius: 32px 32px 0 0; padding: 0 16px 34px; font-family: "Noto Sans SC"; }
.grip { background: #dcdee5; }
.sheet h4 { font: 900 22px "Noto Sans SC"; margin: 6px 6px 4px; } .sheet .hint { font: 600 13px "Noto Sans SC"; color: var(--sub); margin: 0 6px 14px; }
.cam { display: flex; align-items: center; gap: 12px; background: var(--red); color: #fff; border-radius: 24px; padding: 16px; margin-bottom: 10px; }
.cam .ic { width: 48px; height: 48px; border-radius: 16px; background: rgba(255,255,255,.22); display: grid; place-items: center; } .cam .ic svg { width: 26px; height: 26px; }
.cam b { font: 900 17px "Noto Sans SC"; display: block; } .cam small { font: 600 12px "Noto Sans SC"; opacity: .85; }
.alt { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.alt div { background: var(--grey); border-radius: 20px; padding: 14px; font: 800 15px "Noto Sans SC"; }
.qgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qi { border-radius: 22px; overflow: hidden; background: var(--grey); }
.qi .pic { height: 84px; } .qi .t { padding: 8px 12px 10px; display: flex; justify-content: space-between; align-items: center; font: 800 13px "Noto Sans SC"; }
.qi .t b { font: 900 18px Figtree; }
.toast { position: absolute; left: 50%; top: 40px; transform: translate(-50%, -80px); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 999px; font: 800 14px "Noto Sans SC"; z-index: 50; transition: transform .45s cubic-bezier(.3,1.5,.5,1); white-space: nowrap; }
.toast.show { transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="board">
  <div class="board-h">
    <div class="name">GYMEAT<small>一顿一格</small></div>
    <p>顶部一整块番茄红，只放「还能吃 825」和三个最常用的动作。下面的白色面板像抽屉一样抬起来：一排任务，再往下每顿饭一格，格子的封面就是你拍的那张照片。</p>
    <ul>
      <li><b>点「拍照记一笔」或底部 +</b>　弹出记一笔</li>
      <li><b>点「+ 一杯水」</b>　喝水任务推进一格</li>
      <li><b>点空着的晚餐格</b>　记晚餐，825 跟着减</li>
    </ul>
    <div class="zoom"><div class="cap">特写 · 任务完成的那一下</div><div data-zoom></div></div>
  </div>
  <div id="main"></div>
  <div id="second" class="second"></div>
</div>

<template id="app">
  <div class="app">
    <div class="top">
      <div class="row1"><span class="lab">今天还能吃</span><span class="streak"><i>12</i>连续 12 天</span></div>
      <div class="big num"><span data-left>825</span><small>kcal</small></div>
      <div class="sub" data-sub>已吃 1175 / 目标 2000</div>
      <div class="pills">
        <span class="pill main" data-press data-open><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>拍照记一笔</span>
        <span class="pill" data-press data-water>+ 一杯水</span>
        <span class="pill" data-press>称体重</span>
      </div>
    </div>
    <div class="drawer">
      <div class="sec">今日任务<span data-done>完成 1/4</span></div>
      <div class="quests" data-quests></div>
      <div class="sec">今天吃的<span data-count>4 样</span></div>
      <div class="pots" data-pots></div>
    </div>
    <nav class="nav">
      <span class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 11h16a8 8 0 0 1-16 0Z"/><path d="M9 7c0-1.5 1.5-1.5 1.5-3M13.5 7c0-1.5 1.5-1.5 1.5-3"/></svg>今天</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 19V11M10 19V5M16 19v-6M21 19H3"/></svg>趋势</span>
      <div class="plus" data-press data-open><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 4h14v16H5zM5 9h14"/></svg>食物库</span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6" stroke-linecap="round"/></svg>我的</span>
    </nav>
    <div class="backdrop" data-backdrop></div>
    <div class="sheet" data-sheet>
      <span class="grip" data-grip></span>
      <h4 data-grip>记一笔</h4><div class="hint" data-grip>记到：晚餐 · 建议 ≤ 700 kcal</div>
      <div class="cam" data-press><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></div><div><b>拍照识别</b><small>拍一下，AI 估热量和三大营养素</small></div></div>
      <div class="alt"><div data-press>从食物库选</div><div data-press>手动填</div></div>
      <div class="qgrid" data-quick></div>
    </div>
    <div class="toast" data-toast></div>
  </div>
</template>

<script src="shared.js"></script>
<script>
const PASTEL = { protein: '#efe7ff', water: '#dff1ff', meals: '#fff1c9', weight: '#dcf7e6' };
function questHTML(t) {
  return `<div class="q" data-press data-task="${t.key}" style="background:${PASTEL[t.key]}">
    <div class="n">${t.name}</div>
    <div class="v num"><span data-tv>${t.fmt(t.v)}</span><small>${t.key === 'weight' ? '' : ' / ' + t.max + (t.unit ? ' ' + t.unit : '')}</small></div>
    <div class="tr"><i data-tb></i></div><div class="chk" data-chk>+</div></div>`;
}
function mount(host, { openSheet = false, label, zoomOnly = false } = {}) {
  const { phone, spring, pressable, pop, sheet, eaten, mealKcal, tasks, QUICK, initialState } = GYM;
  const s = initialState();
  if (zoomOnly) { // 特写：一张任务卡，循环演示完成
    host.innerHTML = questHTML(tasks(s)[1]).replace('class="q"', 'class="q" style="width:100%"');
    const el = host.querySelector('.q'); el.style.width = '100%'; el.style.background = PASTEL.water;
    let v = 5; const sp = spring(5, (x) => { el.querySelector('[data-tv]').textContent = Math.round(x); el.querySelector('[data-tb]').style.width = x / 8 * 100 + '%'; });
    setInterval(() => { v = v >= 8 ? 5 : v + 1; sp(v); el.classList.toggle('done', v >= 8); el.querySelector('[data-chk]').textContent = v >= 8 ? '✓' : '+'; if (v >= 8) pop(el); }, 900);
    return;
  }
  const p = phone({ label });
  host.appendChild(p.wrap);
  p.content.appendChild(document.getElementById('app').content.cloneNode(true));
  const $ = (q) => p.content.querySelector(q);
  pressable(p.content);

  const leftEl = $('[data-left]');
  const big = spring(eaten(s), (x) => { const l = s.goal - x; leftEl.textContent = l >= 0 ? Math.round(l) : '+' + Math.round(-l); }, { stiffness: 120, damping: 17 });

  function renderPots() {
    const filled = s.meals.filter((m) => m.items.length);
    $('[data-count]').textContent = s.meals.reduce((a, m) => a + m.items.length, 0) + ' 样';
    $('[data-pots]').innerHTML = s.meals.map((m) => m.items.length ? `
      <div class="pot" data-press>
        <div class="pic"><img class="ph" src="${m.items[0].img}" alt="${m.items[0].n}"></div>
        ${m.items.length > 1 ? `<span class="cnt">${m.items.length} 样</span>` : ''}
        <div class="t"><div><b>${m.name}</b><small>${m.items.map((i) => i.n).join(' · ')}</small></div><span class="k num">${mealKcal(m)}</span></div>
      </div>` : `
      <div class="pot add" data-press data-open><span class="plus">+</span>记${m.name}<small>建议 ≤ 700 kcal</small></div>`).join('');
  }
  const springs = {};
  function renderQuests(first) {
    const list = tasks(s);
    if (first) {
      $('[data-quests]').innerHTML = list.map(questHTML).join('');
      list.forEach((t) => { const el = $(`[data-task="${t.key}"]`); springs[t.key] = spring(t.v, (x) => { el.querySelector('[data-tv]').textContent = t.fmt(x); el.querySelector('[data-tb]').style.width = Math.min(100, x / t.max * 100) + '%'; }, { stiffness: 160, damping: 15 }); });
    }
    let done = 0;
    list.forEach((t) => {
      const el = $(`[data-task="${t.key}"]`), ok = t.v >= t.max;
      if (ok) done++;
      if (ok && !el.classList.contains('done') && !first) { pop(el); toast(`${t.name} · 完成`); }
      el.classList.toggle('done', ok); el.querySelector('[data-chk]').textContent = ok ? '✓' : '+';
      springs[t.key](t.v);
    });
    $('[data-done]').textContent = `完成 ${done}/4`;
  }
  function toast(msg) { const t = $('[data-toast]'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1600); }
  function update() { big(eaten(s)); $('[data-sub]').textContent = `已吃 ${eaten(s)} / 目标 2000`; renderPots(); renderQuests(); }

  const sh = sheet(p.screen, $('[data-sheet]'), $('[data-backdrop]'));
  $('[data-quick]').innerHTML = QUICK.map((q, i) => `<div class="qi" data-press data-q="${i}"><div class="pic"><img class="ph" src="${q.img}" alt=""></div><div class="t">${q.n}<b class="num">${q.k}</b></div></div>`).join('');

  p.content.addEventListener('click', (e) => {
    if (e.target.closest('[data-open]')) { sh.show(); return; }
    if (e.target.closest('[data-water]')) { s.cups = Math.min(8, s.cups + 1); renderQuests(); return; }
    const t = e.target.closest('[data-task]');
    if (t) {
      if (t.dataset.task === 'water') s.cups = Math.min(8, s.cups + 1);
      else if (t.dataset.task === 'protein') s.protein = Math.min(150, Math.round((s.protein + 25) * 10) / 10);
      else { sh.show(); return; }
      renderQuests(); return;
    }
    const q = e.target.closest('[data-q]');
    if (q) {
      const item = QUICK[+q.dataset.q];
      s.meals[3].items.push({ n: item.n, k: item.k, img: item.img });
      s.protein = Math.min(150, Math.round((s.protein + item.p) * 10) / 10);
      sh.hide(); setTimeout(() => { update(); toast(`记上了 · ${item.n} ${item.k} kcal`); }, 180);
    }
  });

  renderPots(); renderQuests(true);
  if (openSheet) setTimeout(() => sh.show(), 400);
}
mount(document.getElementById('main'), { label: '首页 · 可以点' });
mount(document.getElementById('second'), { label: '记一笔弹层', openSheet: true });
mount(document.querySelector('[data-zoom]'), { zoomOnly: true });
</script>
</body>
</html>
